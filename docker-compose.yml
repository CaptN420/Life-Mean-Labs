services:
  # Repairs ownership of the run volumes before the dashboard starts.
  # Named volumes keep the owner they got on first creation (root), and the
  # dashboard runs as uid 999 with cap_drop ALL, so it can neither chown nor
  # write there -> "[Errno 13] Permission denied: /app/debate_lab_runs/...".
  # This init container runs as root with default caps, fixes the volumes,
  # then exits; the dashboard keeps its hardened profile untouched.
  volumes-init:
    image: life-mean-dashboard:local
    user: "0"
    entrypoint: ["sh", "-c"]
    command:
      - >-
        chown -R 999:999 /app/debate_lab_runs /app/code_lab_runs /app/studio_data
        /app/philosophical_council/storage/raw_data;
        echo "ownership fixed"; ls -ld /app/debate_lab_runs /app/code_lab_runs
    security_opt:
      - no-new-privileges:true
    volumes:
      - life_mean_code_lab_runs:/app/code_lab_runs
      - life_mean_debate_lab_runs:/app/debate_lab_runs
      - life_mean_philosophical_council:/app/philosophical_council/storage/raw_data
      - life_mean_studio_data:/app/studio_data
    restart: "no"

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: life-mean-dashboard:local
    init: true
    depends_on:
      volumes-init:
        condition: service_completed_successfully
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8080"
      # Studio's registry must survive rebuilds: read_only image + named volume.
      LIFE_MEAN_STUDIO_DB: /app/studio_data/life_mean_studio_data.db
    ports:
      - "127.0.0.1:${LIFE_MEAN_PORT:-8080}:8080"
    # No host bind mounts. These are Docker-managed volumes, not C: paths.
    volumes:
      - life_mean_data:/app/data
      - life_mean_overrides:/app/overrides
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 67108864
      - life_mean_code_lab_runs:/app/code_lab_runs
      - life_mean_debate_lab_runs:/app/debate_lab_runs
      - life_mean_philosophical_council:/app/philosophical_council/storage/raw_data
      - life_mean_studio_data:/app/studio_data
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/dashboard', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  life_mean_data:
  life_mean_overrides:
  life_mean_code_lab_runs:
  life_mean_debate_lab_runs:
  life_mean_philosophical_council:
  life_mean_studio_data: