[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:Bakery"

[project]
name = "captn-runtime"
version = "1.0.0"
description = "CaptN Runtime v1 — Intelligent LLM Runtime Architecture"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
